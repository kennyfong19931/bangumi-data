name: 🇭🇰 hokan
on:
  schedule:
    - cron: '20 22 * * 4'
  workflow_dispatch:

jobs:
  hokan:
    runs-on: ubuntu-latest

    steps:
      - name: Get current time
        id: current-time
        uses: josStorer/get-current-time@v2
        with:
          format: YYYYMMDD-HHmmss

      - name: Set branch name
        id: branch-name
        run: echo "result=$BRANCH_NAME" >> $GITHUB_OUTPUT
        env:
          BRANCH_NAME: 'hokan-hk-${{ steps.current-time.outputs.formattedTime }}'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Checkout bangumi data
        uses: actions/checkout@v6
        with:
          ref: master
          path: ./bangumi-data

      - name: Checkout helper
        uses: actions/checkout@v6
        with:
          repository: kennyfong19931/helper
          ref: local
          path: ./helper
          
      - name: Install dependency
        working-directory: ./helper
        run: npm install

      - name: Checkout ovpn config
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          path: ./vpn

      - name: Create a new branch
        working-directory: ./bangumi-data
        run: git checkout -b ${{ steps.branch-name.outputs.result }}

      - name: Connect to VPN
        uses: "kota65535/github-openvpn-connect-action@v3"
        with:
          config_file: ./vpn/.github/vpn/hk.ovpn
          username: ${{ secrets.NORD_USERNAME }}
          password: ${{ secrets.NORD_PASSWORD }}
          # tls_auth_key: ${{ secrets.NORD_TLS_AUTH }}

      - name: Hokan netflix
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan netflix

      - name: Hokan crunchyroll
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan crunchyroll

      - name: Hokan muse_hk
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan muse_hk

      - name: Hokan ani_one
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan ani_one

      - name: Hokan ani_one_asia
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan ani_one_asia

      - name: Hokan tropics
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan tropics

      - name: Hokan mighty
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan mighty

      - name: Hokan viu
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan viu

      - name: Hokan gamer_hk
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan gamer_hk

      - name: Hokan mytv
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan mytv

      - name: Hokan bilibili_hk_mo_tw
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan bilibili_hk_mo_tw

      - name: Hokan bilibili_hk_mo
        continue-on-error: true
        working-directory: ./helper
        run: npx bdh hokan bilibili_hk_mo

      - name: Edit .gitignore
        working-directory: ./bangumi-data
        run: sed -i '/^data\/items\/0000$/d' .gitignore

      - name: Create patch for helper
        working-directory: ./helper
        run: git diff > ../bangumi-data/helper.patch

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: ./bangumi-data
          commit_message: 🇭🇰 hokan
          branch: ${{ steps.branch-name.outputs.result }}
